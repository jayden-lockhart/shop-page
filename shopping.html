<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--top of the page-->
    <div class="col-md-12">
        <h1>Online Shopping</h1>
        <h2>items</h2>
    </div>

    <!--make rows of 2 images each with text and button-->

    <div class="row">
        <div class="col-md-6">
            <figure>
                <img src="chicken.jpg" class="img-fluid zoom" alt="chicken">
                <figcaption>Chicken</figcaption>
            </figure>
            <p>£6.32</p>
            <button class="btn btn-danger">Buy</button>
        </div>
        <div class="col-md-6">
            <figure>
                <img src="fish.jpg" class="img-fluid zoom" alt="fish">
                <figcaption>Fish</figcaption>
            </figure>
            <p>£8.00</p>
            <button class="btn btn-danger">Buy</button>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <figure>
                <img src="butter.jpg" class="img-fluid zoom" alt="butter">
                <figcaption>Butter</figcaption>
            </figure>
            <p>£1.70</p>
            <button class="btn btn-danger">Buy</button>
        </div>
        <div class="col-md-6">
            <figure>
                <img src="cheese.jpg" class="img-fluid zoom" alt="cheese">
                <figcaption>Cheese</figcaption>
            </figure>
            <p>£3.00</p>
            <button class="btn btn-danger">Buy</button>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <figure>
                <img src="cereal.jpg" class="img-fluid zoom" alt="cereal">
                <figcaption>Cereal</figcaption>
            </figure>
            <p>£5.00</p>
            <button class="btn btn-danger">Buy</button>
        </div>
        <div class="col-md-6">
            <figure>
                <img src="milk.jpg" class="img-fluid zoom" alt="milk">
                <figcaption>Milk</figcaption>
            </figure>
            <p>£1.65</p>
            <button class="btn btn-danger">Buy</button>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <figure>
                <img src="pasta.jpg" class="img-fluid zoom" alt="pasta">
                <figcaption>Pasta</figcaption>
            </figure>
            <p>£1.38</p>
            <button class="btn btn-danger">Buy</button>
        </div>
        <div class="col-md-6">
            <figure>
                <img src="bread.jpg" class="img-fluid zoom" alt="bread">
                <figcaption>Bread</figcaption>
            </figure>
            <p>£1.65</p>
            <button class="btn btn-danger">Buy</button>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <figure>
                <img src="fruit.jpg" class="img-fluid zoom" alt="fruit">
                <figcaption>Fruit</figcaption>
            </figure>
            <p>£2.10</p>
            <button class="btn btn-danger">Buy</button>
        </div>
        <div class="col-md-6">
            <figure>
                <img src="vegetables.jpg" class="img-fluid zoom" alt="vegetables">
                <figcaption>Vegetables</figcaption>
            </figure>
            <p>£1.50</p>
            <button class="btn btn-danger">Buy</button>
        </div>
    </div>

    <footer>
        <div class="row">
            <div class="col-md-9">
                <h2>Contact details</h2>
                <form action="">
                    <label for="name">Enter name</label>
                    <input type="text">
                    <label for="email">Enter email</label>
                    <input type="email">
                    <label for="phone">Enter phone number</label>
                    <input type="text">
                </form>
            </div>
            <div class="col-md-3">
                <img src="shop.jpg" class="img-fluid" alt="logo">
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
